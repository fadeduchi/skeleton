<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: system-ui, Arial;
      display: flex;
      height: 100vh;
    }

    .app {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* CHAT */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 70%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #2b7cff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #1a1a22;
      color: #eaeaea;
    }

    /* INPUT */
    .bar {
      display: flex;
      padding: 12px;
      border-top: 1px solid #222;
      background: #0f0f14;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1a1a22;
      color: white;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #2b7cff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1f6ae6;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="chat"></div>

  <div class="bar">
    <input id="input" placeholder="Escribe un mensaje..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
